version: v1
plugins:
  - name: go
    path: protoc-gen-go
    out: ./pkg/
    opt:
      - paths=source_relative
    strategy: directory
  - name: go-grpc
    path: protoc-gen-go-grpc
    out: ./pkg/
    opt:
      - paths=source_relative
    strategy: directory
  - name: grpc-gateway
    path: protoc-gen-grpc-gateway
    out: ./pkg/
    opt:
      - logtostderr=true
      - paths=source_relative
      - generate_unbound_methods=true
    strategy: directory
  - name: openapiv2
    path: protoc-gen-openapiv2
    out: ./pkg/
    opt:
      - preserve_rpc_order=true
      - generate_unbound_methods=true
    strategy: directory
