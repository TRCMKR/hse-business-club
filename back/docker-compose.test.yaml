# Infrastructure for integration tests (make test-env-up / make test-integration)
# and for `make run` locally. I0 replaces it with the root docker-compose.yaml.
name: hbc-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hbc
      POSTGRES_PASSWORD: hbc
      POSTGRES_DB: hbc
    ports:
      - "5433:5432"
    # Throwaway data in RAM: tests need no persistence, and the Docker VM disk is small.
    tmpfs:
      - /var/lib/postgresql/data:rw,size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hbc -d hbc"]
      interval: 2s
      timeout: 3s
      retries: 30

  # minio/minio is no longer published on Docker Hub (pull access denied);
  # the Chainguard build is the upstream MinIO server binary. Chainguard publishes
  # only :latest for free, so the image is pinned by digest
  # (RELEASE.2026-09-22T19-25-18Z); I0 uses the same reference.
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:2915cb406f38ed6ff9634de0a3e4a9423e2dda06a6f1aca18f8c968aa37a01f6
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    user: root
    ports:
      - "9000:9000"
    tmpfs:
      - /data:rw,size=256m
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r l <&3 && [[ $$l == *200* ]]"]
      interval: 2s
      timeout: 3s
      retries: 30
