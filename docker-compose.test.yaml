# Override for backend integration/e2e tests (back/Makefile: test-env-up, test-integration, test-e2e):
#   docker compose -f docker-compose.yaml -f docker-compose.test.yaml up -d --wait db minio
# Separate project name, so tests never touch the dev stack or its db_data/minio_data volumes.
# Postgres and MinIO keep data in tmpfs: every test-env-up starts from scratch.
name: hbc-test-env

services:
  db:
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      interval: 2s
      retries: 30
    restart: "no"

  minio:
    volumes: !reset []
    tmpfs:
      - /data
    ports:
      - "${TEST_MINIO_PORT:-9000}:9000"
    healthcheck:
      interval: 2s
      retries: 30
    restart: "no"
